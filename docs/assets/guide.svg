    <rect x="302" y="836" width="90" height="22" rx="11" fill="#222220" stroke="#444441" stroke-width="0.5"/>
    <text x="347" y="851" font-size="10" fill="#888780" text-anchor="middle">OAuth / SSO</text>
    <rect x="402" y="836" width="136" height="22" rx="11" fill="#222220" stroke="#444441" stroke-width="0.5"/>
    <text x="470" y="851" font-size="10" fill="#888780" text-anchor="middle">configurable expiration</text>

    <!-- footer -->
    <text x="340" y="902" font-size="11" fill="#444441" text-anchor="middle">bullhub · github.com/seu-user/bullhub · MIT</text>

