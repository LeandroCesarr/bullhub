    <text x="583" y="396" font-size="11" fill="#5DCAA5" text-anchor="middle">/bullhub/*</text>

    <!-- ── AUTH ── -->
    <text x="40" y="444" font-size="10" font-weight="500" fill="#888780" letter-spacing="0.08em">AUTHENTICATION</text>

    <!-- docker auth -->
    <rect x="40" y="452" width="288" height="120" rx="12" fill="#1a1a18" stroke="#2e2e2b" stroke-width="0.5"/>
    <rect x="54" y="466" width="22" height="22" rx="11" fill="#2a1f08" stroke="#BA7517" stroke-width="0.5"/>
    <text x="65" y="481" font-size="11" font-weight="500" fill="#FAC775" text-anchor="middle">1</text>
    <text x="86" y="475" font-size="12" font-weight="500" fill="#D3D1C7">docker mode</text>
    <text x="86" y="491" font-size="11" fill="#888780">session stored in Redis</text>
    <line x1="54" y1="500" x2="314" y2="500" stroke="#2e2e2b" stroke-width="0.5"/>

    <rect x="54" y="510" width="54" height="20" rx="10" fill="#222220" stroke="#444441" stroke-width="0.5"/>
    <text x="81" y="524" font-size="10" fill="#888780" text-anchor="middle">login UI</text>
    <line x1="108" y1="520" x2="118" y2="520" stroke="#444441" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="120" y="510" width="76" height="20" rx="10" fill="#222220" stroke="#444441" stroke-width="0.5"/>
    <text x="158" y="524" font-size="10" fill="#888780" text-anchor="middle">POST /api/auth</text>
    <line x1="196" y1="520" x2="206" y2="520" stroke="#444441" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="208" y="510" width="96" height="20" rx="10" fill="#222220" stroke="#444441" stroke-width="0.5"/>
    <text x="256" y="524" font-size="10" fill="#888780" text-anchor="middle">opaque token</text>

    <text x="54" y="550" font-size="11" fill="#888780">reuses BullMQ Redis connection</text>
    <text x="54" y="564" font-size="11" fill="#888780">Authorization: Bearer on every request</text>

    <!-- embedded auth -->
    <rect x="352" y="452" width="288" height="120" rx="12" fill="#1a1a18" stroke="#2e2e2b" stroke-width="0.5"/>
    <rect x="366" y="466" width="22" height="22" rx="11" fill="#2a1f08" stroke="#BA7517" stroke-width="0.5"/>
    <text x="377" y="481" font-size="11" font-weight="500" fill="#FAC775" text-anchor="middle">2</text>
    <text x="398" y="475" font-size="12" font-weight="500" fill="#D3D1C7">embedded mode</text>
    <text x="398" y="491" font-size="11" fill="#888780">project manages auth</text>
    <line x1="366" y1="500" x2="626" y2="500" stroke="#2e2e2b" stroke-width="0.5"/>
    <text x="366" y="518" font-size="11" fill="#888780">bullhub does not manage auth</text>
    <text x="366" y="534" font-size="11" fill="#888780">adapter receives validate(req): Promise&lt;boolean&gt;</text>
    <text x="366" y="550" font-size="11" fill="#888780">plugs into framework's existing auth system</text>
    <text x="366" y="566" font-size="11" fill="#888780">(Adonis · NestJS guard · Fastify hook)</text>

    <!-- ── DELIVERY PHASES ── -->
    <text x="40" y="600" font-size="10" font-weight="500" fill="#888780" letter-spacing="0.08em">DELIVERY PHASES</text>

    <rect x="40" y="608" width="288" height="88" rx="12" fill="#1a1a18" stroke="#2e2e2b" stroke-width="0.5"/>
    <rect x="54" y="622" width="22" height="22" rx="11" fill="#222220" stroke="#444441" stroke-width="0.5"/>
    <text x="65" y="637" font-size="11" font-weight="500" fill="#888780" text-anchor="middle">1</text>
    <text x="86" y="631" font-size="12" font-weight="500" fill="#D3D1C7">docker mode</text>
    <text x="86" y="648" font-size="11" fill="#888780">SPA + Hono api + Docker image</text>
    <text x="86" y="664" font-size="11" fill="#888780">works with any stack, no install needed</text>
    <text x="86" y="680" font-size="11" fill="#888780">session auth via Redis</text>

    <rect x="352" y="608" width="288" height="88" rx="12" fill="#1a1a18" stroke="#2e2e2b" stroke-width="0.5"/>
    <rect x="366" y="622" width="22" height="22" rx="11" fill="#222220" stroke="#444441" stroke-width="0.5"/>
    <text x="377" y="637" font-size="11" font-weight="500" fill="#888780" text-anchor="middle">2</text>
    <text x="398" y="631" font-size="12" font-weight="500" fill="#D3D1C7">embedded mode · npm</text>
    <text x="398" y="648" font-size="11" fill="#888780">same core, same Hono app</text>
    <text x="398" y="664" font-size="11" fill="#888780">adapter serves dist/ + proxies to core</text>
    <text x="398" y="680" font-size="11" fill="#888780">auth delegated to host project</text>

