    <rect x="550" y="746" width="76" height="22" rx="11" fill="#222220" stroke="#444441" stroke-width="0.5"/>
    <text x="588" y="761" font-size="10" fill="#888780" text-anchor="middle">list workers</text>

    <!-- ── ROADMAP ── -->
    <text x="40" y="814" font-size="10" font-weight="500" fill="#888780" letter-spacing="0.08em">AUTH ROADMAP · V2+</text>
    <rect x="40" y="822" width="600" height="52" rx="12" fill="#1a1a18" stroke="#2e2e2b" stroke-width="0.5"/>

