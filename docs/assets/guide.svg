    <text x="267" y="396" font-size="11" fill="#888780" text-anchor="middle">index.html + assets</text>

    <line x1="332" y1="386" x2="362" y2="386" stroke="#444441" stroke-width="1" marker-end="url(#arr)"/>

    <rect x="364" y="358" width="130" height="56" rx="8" fill="#2d1a10" stroke="#D85A30" stroke-width="0.5"/>
