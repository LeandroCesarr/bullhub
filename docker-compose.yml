services:
  bullhub:
    image: bullhub/standalone:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bullhub
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production

      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379

      BULLMQ_QUEUES_JSON: >
        [
          {"name":"email-queue","prefix":"bullhub"},
          {"name":"notification-queue","prefix":"bullhub"},
          {"name":"report-generation","prefix":"bullhub"},
          {"name":"image-processing","prefix":"bullhub"},
          {"name":"webhook-delivery","prefix":"bullhub"}
        ]

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bullhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  redis-data:
